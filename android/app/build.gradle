apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}

android {
    namespace 'com.dailyinternetoffer.bd'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.dailyinternetoffer.bd"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 34
        versionName "34"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def kFile = file('release.keystore')
            if (!kFile.exists()) {
                kFile = file('../release.keystore')
            }
            if (!kFile.exists()) {
                kFile = file('../../release.keystore')
            }
            if (kFile.exists()) {
                storeFile kFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "almayadin123"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "almayadin"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "almayadin123"
            }
        }
    }

    buildTypes {
        release {
            def kFile = file('release.keystore')
            if (!kFile.exists()) {
                kFile = file('../release.keystore')
            }
            if (!kFile.exists()) {
                kFile = file('../../release.keystore')
            }
            if (kFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.android.billingclient:billing:6.1.0'
}

def capBuild = file('capacitor.build.gradle')
if (capBuild.exists()) {
    apply from: capBuild
}
