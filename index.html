    <script>
      // Gracefully handle dynamic import chunk errors on server updates
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.includes('Failed to fetch dynamically imported module') ||
          e.message.includes('Importing a module script failed') ||
          e.message.includes('ChunkLoadError')
        )) {
          console.warn('Dynamic import chunk error caught, reloading page...', e);
          window.location.reload();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && (
          e.reason.message.includes('Failed to fetch dynamically imported module') ||
          e.reason.message.includes('Importing a module script failed') ||
          e.reason.message.includes('ChunkLoadError')
        )) {
          console.warn('Dynamic import promise rejection caught, reloading page...', e);
          window.location.reload();
        }
      });
