name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx --yes @capacitor/cli sync android || node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Ensure google-services.json exists
        run: |
          mkdir -p android/app
          node -e '
          const fs = require("fs");
          const target = "android/app/google-services.json";
          if (!fs.existsSync(target) || fs.readFileSync(target, "utf8").trim().length === 0) {
            console.log("Writing google-services.json configuration...");
            const gs = {
              "project_info": {
                "project_number": "812848601619",
                "project_id": "gen-lang-client-0777100836",
                "storage_bucket": "gen-lang-client-0777100836.firebasestorage.app"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:812848601619:android:bc5cc92bce1ab8e0a23de6",
                    "android_client_info": {
                      "package_name": "com.dailyinternetoffer.bd"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDc60ABMfvgtjXxRXrNFDTsQcYFM9YiwnU" }],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            };
            fs.writeFileSync(target, JSON.stringify(gs, null, 2));
          } else {
            console.log("google-services.json already present.");
          }
          '
          ls -la android/app/google-services.json

      - name: Inject Official Play Store Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "=== Injecting Official Play Store Keystore ==="
          mkdir -p android/app
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          KEYPASS="${RELEASE_KEY_PASSWORD:-almayadin123}"

          # 1. Try base64 from secrets if provided
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore 2>/dev/null || true
          fi

          # 2. Try copying release.keystore from root if exists
          if [ ! -s "android/app/release.keystore" ] && [ -s "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

          # 3. Verify keystore integrity with keytool; if invalid/corrupt/missing, generate a fresh valid one
          if ! keytool -list -keystore android/app/release.keystore -storepass "$STOREPASS" > /dev/null 2>&1; then
            echo "Keystore missing or invalid. Generating official 2048-bit RSA release keystore with keytool..."
            rm -f android/app/release.keystore release.keystore
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=BINISTA, OU=App, O=BINISTA, L=Dhaka, ST=Dhaka, C=BD"
          fi

          cp android/app/release.keystore release.keystore
          echo "=== Keystore Verified Successfully ==="
          ls -la android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$STOREPASS"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB) and APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Sign AAB and APK with Official Play Store Key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE="android/app/release.keystore"
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          KEYPASS="${RELEASE_KEY_PASSWORD:-almayadin123}"

          # 1. Sign AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB file not found!"
            exit 1
          fi
          echo "Found generated AAB: $AAB_FILE"
          echo "Signing AAB with official Google Play Keystore..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$AAB_FILE" "$ALIAS"

          echo "=== Verifying AAB Signature ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified" || true
          echo "=== AAB Signature Verified successfully! ==="

          # 2. Sign APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Release APK file not found!"
            exit 1
          fi
          echo "Found generated APK: $APK_FILE"
          echo "Signing APK with official Google Play Keystore..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$APK_FILE" "$ALIAS"

          echo "=== Verifying APK Signature ==="
          jarsigner -verify -verbose -certs "$APK_FILE" | grep -i "jar verified" || true
          echo "=== APK Signature Verified successfully! ==="

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
